<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C74920; } a:hover { color: #F06435; }
    .scr {
      --ink:#191A1C; --ink2:#494B4F; --ink3:#686A6F; --muted:#81838A; --faint:#AAA9A6;
      --bg:#F7F6F2; --surface:#FFFFFF; --sunken:#EFEEE9;
      --line:rgba(25,26,28,.12); --lineSoft:rgba(25,26,28,.07);
      --av:#F06435; --avDeep:#C74920; --avSoft:#FFF0E9; --avLine:rgba(240,100,53,.25);
      --br:#326B86; --brSoft:#EDF5F8; --brLine:rgba(50,107,134,.22);
      --ok:#2F7D5B; --okSoft:#EAF5EF; --danger:#B94B3C; --dangerSoft:#FBEDEA;
      --serif:"Noto Serif SC","Songti SC",serif;
      --sans:"Noto Sans SC",-apple-system,"PingFang SC",sans-serif;
      width:390px; height:844px; position:relative; overflow:hidden; box-sizing:border-box;
      color:var(--ink); font-family:var(--sans);
      background:radial-gradient(circle at 86% 0%, rgba(240,100,53,.07), transparent 24%), var(--bg);
      -webkit-font-smoothing:antialiased;
    }
    .scr * { box-sizing:border-box; }
    .safe { height:44px; }
    .navrow { height:40px; display:flex; align-items:center; gap:12px; padding:0 16px 0 12px; }
    .back { width:36px; height:36px; flex:0 0 36px; display:flex; align-items:center; justify-content:center;
      border-radius:12px; background:rgba(255,255,255,.72); border:1px solid rgba(25,26,28,.06);
      box-shadow:0 4px 14px rgba(95,72,55,.06); }
    .ttl { flex:1; font-family:var(--serif); font-weight:600; font-size:17px; }
    .navact { font-size:12px; color:var(--muted); }

    .body { padding:6px 20px 0; display:flex; flex-direction:column; gap:6px; }
    .card { background:var(--surface); border:1px solid var(--lineSoft); border-radius:20px;
      box-shadow:0 4px 14px rgba(95,72,55,.06); padding:10px; }

    .hero { display:flex; gap:14px; align-items:center; }
    .poster { width:68px; height:120px; border-radius:14px; flex:none; position:relative; overflow:hidden;
      background-image:radial-gradient(circle at 72% 18%, rgba(255,244,205,.85) 0 12%, transparent 34%),
        linear-gradient(145deg,#E8B679 0%,#C77A53 52%,#6D554B 100%);
      box-shadow:0 10px 24px rgba(69,54,44,.18); }
    .poster .play { position:absolute; left:50%; top:50%; width:38px; height:38px; margin:-19px 0 0 -19px;
      border-radius:50%; background:rgba(255,255,255,.92); display:flex; align-items:center; justify-content:center; }
    .poster .dim { position:absolute; inset:0; background:rgba(24,20,18,.5); display:flex;
      align-items:center; justify-content:center; }
    .spin { width:26px; height:26px; border-radius:50%; border:3px solid rgba(255,255,255,.28);
      border-top-color:#FFF; animation:sp 1s linear infinite; }
    @keyframes sp { to { transform:rotate(360deg); } }
    .herob { flex:1; min-width:0; }
    .heroh { font-family:var(--serif); font-size:17px; font-weight:600; line-height:1.4; }
    .heros { font-size:11.5px; color:var(--ink3); line-height:1.55; margin-top:6px; }
    .pill { display:inline-flex; align-items:center; gap:5px; margin-top:10px; padding:5px 10px;
      border-radius:999px; font-size:11.5px; font-weight:600; }
    .pill.run { background:var(--avSoft); color:var(--avDeep); border:1px solid var(--avLine); }
    .pill.bad { background:var(--dangerSoft); color:var(--danger); border:1px solid rgba(185,75,60,.22); }
    .pill.ok { background:var(--okSoft); color:var(--ok); border:1px solid rgba(47,125,91,.22); }

    .rowh { font-size:12px; color:var(--muted); margin-bottom:2px; }
    .job { display:flex; align-items:center; gap:10px; padding:3px 0; border-bottom:1px solid var(--lineSoft); }
    .job:last-child { border-bottom:none; padding-bottom:0; }
    .dot { width:20px; height:20px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; }
    .dot.ok { background:var(--okSoft); }
    .dot.run { background:var(--avSoft); }
    .dot.bad { background:var(--dangerSoft); }
    .dot.wait { background:var(--sunken); }
    .jobb { flex:1; min-width:0; }
    .jobt { display:block; font-size:13px; font-weight:600; }
    .jobs { display:block; font-size:11.5px; color:var(--ink3); margin-top:2px; line-height:1.5; }
    .jobv { flex:none; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
    .retry { flex:none; font-size:12px; font-weight:600; color:var(--danger); padding:5px 11px;
      border-radius:999px; background:var(--dangerSoft); border:1px solid rgba(185,75,60,.22); }

    .bar { height:6px; border-radius:999px; background:var(--sunken); overflow:hidden; margin-top:12px; }
    .fill { height:6px; border-radius:999px; background:var(--av); }

    .leave { display:flex; align-items:flex-start; gap:10px; padding:11px 13px; border-radius:16px;
      background:var(--brSoft); border:1px solid var(--brLine); }
    .leavet { display:block; font-size:12.5px; font-weight:600; color:var(--br); }
    .leaves { display:block; font-size:11.5px; color:var(--ink3); line-height:1.65; margin-top:4px; }

    .trace { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
    .tg { font-size:11px; padding:4px 9px; border-radius:999px; background:var(--sunken);
      color:var(--ink3); border:1px solid var(--lineSoft); }

    .acts { display:flex; gap:8px; }
    .ab { flex:1; height:40px; border-radius:14px; border:1px solid var(--line); background:var(--surface);
      display:flex; align-items:center; justify-content:center; gap:6px; font-size:13.5px;
      color:var(--ink2); font-weight:500; }

    .footer { position:absolute; left:0; right:0; bottom:0; background:rgba(255,255,255,.97);
      border-top:1px solid var(--lineSoft); box-shadow:0 -10px 30px rgba(69,54,44,.08);
      padding:9px 20px 34px; display:flex; align-items:center; gap:12px; }
    .fm { flex:1; min-width:0; }
    .fm .a { display:block; font-size:12px; font-weight:600; }
    .fm .b { display:block; font-size:11px; color:var(--muted); margin-top:2px; }
    .cta { flex:none; height:46px; padding:0 20px; border-radius:15px; background:var(--av); color:#FFF;
      font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center;
      box-shadow:0 10px 22px rgba(240,100,53,.22), inset 0 1px 0 rgba(255,255,255,.35); }
    .cta.ghost { background:var(--surface); color:var(--ink2); border:1px solid var(--line);
      box-shadow:none; font-weight:600; }
  </style>
</helmet>

<div class="scr">
  <div class="safe"></div>
  <div class="navrow">
    <div class="back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#191A1C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div class="ttl">{{ title }}</div>
  </div>

  <div class="body">
    <div class="card">
      <div class="hero">
        <div class="poster">
          <sc-if value="{{ done }}" hint-placeholder-val="{{ true }}">
            <div class="play">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="#191A1C"><path d="M8 5l12 7-12 7z"/></svg>
            </div>
          </sc-if>
          <sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}">
            <div class="dim"><div class="spin"></div></div>
          </sc-if>
        </div>
        <div class="herob">
          <div class="heroh">{{ heroTitle }}</div>
          <div class="heros">{{ heroSub }}</div>
          <div class="pill {{ pillCls }}">{{ pillText }}</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="rowh">制作进度</div>
      <sc-for list="{{ jobs }}" as="j" hint-placeholder-count="4">
        <div class="job">
          <span class="dot {{ j.cls }}">
            <sc-if value="{{ j.isOk }}" hint-placeholder-val="{{ true }}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#2F7D5B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
            </sc-if>
            <sc-if value="{{ j.isBad }}" hint-placeholder-val="{{ false }}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#B94B3C" stroke-width="2.8" stroke-linecap="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
            </sc-if>
            <sc-if value="{{ j.isRun }}" hint-placeholder-val="{{ false }}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#C74920" stroke-width="2.6" stroke-linecap="round"><path d="M12 3v4"/><path d="M12 17v4"/><path d="M3 12h4"/><path d="M17 12h4"/></svg>
            </sc-if>
          </span>
          <span class="jobb">
            <span class="jobt">{{ j.name }}</span>
            <span class="jobs">{{ j.sub }}</span>
          </span>
          <sc-if value="{{ j.isBad }}" hint-placeholder-val="{{ false }}">
            <span class="retry" onClick="{{ j.retry }}">重新生成</span>
          </sc-if>
          <sc-if value="{{ j.showVal }}" hint-placeholder-val="{{ true }}">
            <span class="jobv">{{ j.val }}</span>
          </sc-if>
        </div>
      </sc-for>
      <sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}">
        <div class="bar"><div class="fill" style="width:{{ pct }}%"></div></div>
      </sc-if>
    </div>

    <sc-if value="{{ notDone }}" hint-placeholder-val="{{ true }}">
      <div class="leave">
        <span style="flex:none;margin-top:1px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#326B86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </span>
        <span>
          <span class="leavet">可退出等待</span>
          <span class="leaves">完成后微信通知你。已生成的片段不会重做，也不重复扣费。</span>
        </span>
      </div>
    </sc-if>

    <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
      <div class="card">
        <div class="rowh">制作信息</div>
        <div class="trace">
          <span class="tg">模板 · 为实体发声</span>
          <span class="tg">脚本 · 王记五金 第 2 版</span>
          <span class="tg">数字人 · 王老板门店机位</span>
          <span class="tg">素材 · 17 段实拍</span>
          <span class="tg">时长 · 2:43</span>
        </div>
      </div>
      <div class="acts">
        <div class="ab">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#494B4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          保存到相册
        </div>
        <div class="ab">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#494B4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4"/><path d="M15.4 6.5l-6.8 4"/></svg>
          分享
        </div>
        <div class="ab">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#494B4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          复制并修改
        </div>
      </div>
    </sc-if>
  </div>

  <div class="footer">
    <div class="fm">
      <span class="a">{{ footA }}</span>
      <span class="b">{{ footB }}</span>
    </div>
    <div class="cta {{ ctaCls }}">{{ ctaText }}</div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"stage":{"editor":"enum","default":"failed","options":["running","failed","done"],"section":"状态"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { stage: null };
  }

  componentWillUnmount() {
    if (this.timer) clearTimeout(this.timer);
  }

  stage() {
    return this.state.stage || this.props.stage || 'failed';
  }

  renderVals() {
    const st = this.stage();
    const done = st === 'done';
    const bad = st === 'failed';
    const busy = st === 'running';

    // ct_shiti 全片：数字人 4 段共 32 秒，其中第 1 段上一轮已先行生成，本轮只做第 7、13、21 段。
    // 没有「AI 画面」这一档 —— T2V/I2V 已整块移出 P0（方案 §0.0、§4.4）。
    const jobs = [
      { name: '数字人出镜 26 秒 · 第 7、13、21 段', sub: bad ? '第 13 段生成超时，该段未完成' : (busy ? '生成中 · 约 90 秒' : '已生成 · 已存入素材库'),
        cls: bad ? 'bad' : (busy ? 'run' : 'ok'), isBad: bad, isRun: busy, isOk: done, val: '26 钻石' },
      { name: '数字人出镜 6 秒 · 第 1 段', sub: '用的是上次已生成的片段，未重新生成',
        cls: 'ok', isOk: true, isBad: false, isRun: false, val: '0 钻石' },
      { name: '口播配音 2:33', sub: '进预览前已生成，与你听到的是同一条',
        cls: 'ok', isOk: true, isBad: false, isRun: false, val: '3 钻石' },
      { name: '字幕 · 音乐 · 转场', sub: '与你确认的预览为同一版本',
        cls: 'ok', isOk: true, isBad: false, isRun: false, val: '免费' },
      { name: '合成高清成片 1080×1920', sub: bad ? '等待上一段完成后开始' : (busy ? '排队中' : '完成 · 163.0 秒'),
        cls: (bad || busy) ? 'wait' : 'ok', isOk: done, isBad: false, isRun: false, val: '' },
    ];

    return {
      title: done ? '作品' : '生成中',
      done: done,
      busy: busy,
      notDone: !done,
      pct: 62,
      heroTitle: done ? '为实体发声 · 2 分 43 秒' : (bad ? '1 段生成失败' : '正在生成这 26 秒'),
      heroSub: done
        ? '与你确认的版本完全一致，只有这 26 秒为新生成。'
        : (bad
          ? '其余片段均已完成。仅按成功部分扣费，重新生成这一段不影响其他片段。'
          : '其余片段均已就绪，仅等这三段。'),
      pillCls: done ? 'ok' : (bad ? 'bad' : 'run'),
      pillText: done ? '02:43 · 已完成' : (bad ? '1 段失败 · 该段未扣费' : '预计还需 90 秒'),
      jobs: jobs.map((j) => ({
        name: j.name, sub: j.sub, cls: j.cls,
        isOk: j.isOk, isBad: j.isBad, isRun: j.isRun,
        showVal: !j.isBad && !!j.val, val: j.val,
        retry: () => {
          this.setState({ stage: 'running' });
          this.timer = setTimeout(() => this.setState({ stage: 'done' }), 1400);
        },
      })),
      footA: done ? '实际扣费 29 钻石' : (bad ? '已冻结 29 钻石 · 失败部分退回' : '已冻结 29 钻石'),
      footB: done ? '余额 211 钻石' : '生成成功才结算，失败自动退回',
      ctaText: done ? '再做一条' : '返回预览',
      ctaCls: done ? '' : 'ghost',
    };
  }
}
</script>
</body>
</html>
