<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C74920; } a:hover { color: #F06435; }
    .scr {
      --ink:#191A1C; --ink2:#494B4F; --ink3:#686A6F; --muted:#81838A; --faint:#AAA9A6;
      --bg:#F7F6F2; --surface:#FFFFFF; --sunken:#EFEEE9;
      --line:rgba(25,26,28,.12); --lineSoft:rgba(25,26,28,.07);
      --av:#F06435; --avDeep:#C74920; --avSoft:#FFF0E9; --avLine:rgba(240,100,53,.25);
      --br:#326B86; --brSoft:#EDF5F8; --brLine:rgba(50,107,134,.22);
      --ok:#2F7D5B; --okSoft:#EAF5EF;
      --serif:"Noto Serif SC","Songti SC",serif;
      --sans:"Noto Sans SC",-apple-system,"PingFang SC",sans-serif;
      width:390px; height:844px; position:relative; overflow:hidden; box-sizing:border-box;
      color:var(--ink); font-family:var(--sans);
      background:radial-gradient(circle at 50% 14%, rgba(240,100,53,.10), transparent 34%), var(--bg);
      -webkit-font-smoothing:antialiased;
    }
    .scr * { box-sizing:border-box; }
    .safe { height:44px; }
    .navrow { height:40px; display:flex; align-items:center; gap:12px; padding:0 16px 0 12px; }
    .back { width:36px; height:36px; flex:0 0 36px; display:flex; align-items:center; justify-content:center;
      border-radius:12px; background:rgba(255,255,255,.72); border:1px solid rgba(25,26,28,.06); }
    .ttl { flex:1; font-family:var(--serif); font-weight:600; font-size:17px; }

    .stage { padding:10px 24px 0; text-align:center; }
    .lede { font-family:var(--serif); font-size:22px; font-weight:600; line-height:1.5; }
    .sub { font-size:12.5px; color:var(--ink3); line-height:1.7; margin-top:9px; }

    .said { margin-top:12px; min-height:74px; display:flex; align-items:center; justify-content:center;
      padding:0 4px; }
    .saidtx { font-family:var(--serif); font-size:19px; font-weight:500; line-height:1.7; color:var(--ink); }
    .wave { display:flex; align-items:flex-end; justify-content:center; gap:5px; height:52px; }
    .wave i { width:5px; border-radius:999px; background:var(--av); display:block;
      animation:bounce .9s ease-in-out infinite; }
    .wave i:nth-child(1) { height:16px; animation-delay:0s; }
    .wave i:nth-child(2) { height:34px; animation-delay:.12s; }
    .wave i:nth-child(3) { height:50px; animation-delay:.24s; }
    .wave i:nth-child(4) { height:28px; animation-delay:.36s; }
    .wave i:nth-child(5) { height:44px; animation-delay:.48s; }
    .wave i:nth-child(6) { height:20px; animation-delay:.6s; }
    .wave i:nth-child(7) { height:36px; animation-delay:.72s; }
    @keyframes bounce { 0%,100% { transform:scaleY(.45); } 50% { transform:scaleY(1); } }

    .tags { display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin-top:6px; }
    .tag { display:inline-flex; align-items:baseline; gap:5px; font-size:12px; padding:6px 11px;
      border-radius:999px; background:var(--surface); border:1px solid var(--lineSoft);
      box-shadow:0 4px 14px rgba(95,72,55,.06); }
    .tag b { font-size:10.5px; color:var(--muted); font-weight:500; }
    .tag span { font-weight:600; }

    .micwrap { display:flex; flex-direction:column; align-items:center; margin-top:10px; }
    .mic { width:86px; height:86px; border-radius:50%; display:flex; align-items:center; justify-content:center;
      background:var(--av); box-shadow:0 14px 30px rgba(240,100,53,.28), inset 0 1px 0 rgba(255,255,255,.35); }
    .mic.rec { background:var(--avDeep); box-shadow:0 0 0 10px rgba(240,100,53,.14), 0 14px 30px rgba(240,100,53,.3); }
    .micl { font-size:12.5px; color:var(--ink3); margin-top:12px; }

    .egs { display:flex; flex-direction:column; gap:6px; margin-top:12px; }
    .eg { text-align:left; font-size:12.5px; color:var(--ink2); line-height:1.55; padding:9px 13px;
      border-radius:14px; background:var(--surface); border:1px solid var(--lineSoft); }
    .eg b { color:var(--muted); font-weight:500; font-size:11px; display:block; margin-bottom:3px; }

    /* 底栏 = 9 + 46 + 34(安全区) = 89；这里必须跟着它走，不能各写各的 */
    .alt { position:absolute; left:0; right:0; bottom:101px; padding:0 20px; }
    .altk { font-size:11.5px; color:var(--muted); text-align:center; margin-bottom:9px; }
    .altrow { display:flex; gap:8px; }
    .alti { flex:1; padding:11px 8px; border-radius:14px; background:var(--surface);
      border:1px solid var(--lineSoft); text-align:center; box-shadow:0 4px 14px rgba(95,72,55,.06); }
    .alti span { display:block; font-size:11.5px; font-weight:500; margin-top:6px; color:var(--ink2); }

    .footer { position:absolute; left:0; right:0; bottom:0; background:rgba(255,255,255,.97);
      border-top:1px solid var(--lineSoft); box-shadow:0 -10px 30px rgba(69,54,44,.08);
      padding:9px 20px 34px; display:flex; align-items:center; gap:10px; }
    .redo { flex:none; height:46px; padding:0 16px; border-radius:16px; border:1px solid var(--line);
      background:var(--surface); color:var(--ink2); font-size:14px; font-weight:500;
      display:flex; align-items:center; justify-content:center; }
    .cta { flex:1; height:46px; border-radius:15px; background:var(--av); color:#FFF;
      font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center;
      box-shadow:0 10px 22px rgba(240,100,53,.22), inset 0 1px 0 rgba(255,255,255,.35); }
    .cta.off { opacity:.45; box-shadow:none; }
  </style>
</helmet>

<div class="scr">
  <div class="safe"></div>
  <div class="navrow">
    <div class="back">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#191A1C" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
    </div>
    <div class="ttl">语音输入</div>
  </div>

  <div class="stage">
    <sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}">
      <div class="lede">说说要做什么视频</div>
      <div class="sub">口语描述即可，系统会自动整理成脚本。</div>
    </sc-if>
    <sc-if value="{{ rec }}" hint-placeholder-val="{{ false }}">
      <div class="lede">正在听</div>
      <div class="sub">说完松开</div>
    </sc-if>
    <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
      <div class="lede">识别结果</div>
      <div class="sub">有出入可以重录，没问题就继续。</div>
    </sc-if>

    <div class="said">
      <sc-if value="{{ rec }}" hint-placeholder-val="{{ false }}">
        <div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </sc-if>
      <sc-if value="{{ done }}" hint-placeholder-val="{{ true }}">
        <div class="saidtx">“{{ text }}”</div>
      </sc-if>
    </div>

    <sc-if value="{{ done }}" hint-placeholder-val="{{ true }}">
      <div class="tags">
        <span class="tag"><b>主体</b><span>王记五金</span></span>
        <span class="tag"><b>目标</b><span>门店曝光</span></span>
        <span class="tag"><b>风格</b><span>人文纪实</span></span>
        <span class="tag"><b>时长</b><span>约 2 分钟</span></span>
      </div>
    </sc-if>

    <sc-if value="{{ notDone }}" hint-placeholder-val="{{ true }}">
      <div class="micwrap">
        <div class="mic {{ micCls }}" onClick="{{ toggle }}">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
        </div>
        <div class="micl">{{ micLabel }}</div>
      </div>

      <sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}">
        <div class="egs">
          <sc-for list="{{ egs }}" as="e" hint-placeholder-count="3">
            <div class="eg" onClick="{{ e.use }}"><b>{{ e.k }}</b>{{ e.t }}</div>
          </sc-for>
        </div>
      </sc-if>
    </sc-if>
  </div>

  <sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}">
    <div class="alt">
      <div class="altk">也可以</div>
      <div class="altrow">
        <div class="alti">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#494B4F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13.5a4 4 0 0 0 5.7.3l2.6-2.6a4 4 0 0 0-5.7-5.7l-1.4 1.4"/><path d="M14 10.5a4 4 0 0 0-5.7-.3l-2.6 2.6a4 4 0 0 0 5.7 5.7l1.4-1.4"/></svg>
          <span>粘贴链接</span>
        </div>
        <div class="alti">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#494B4F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8l8-4 8 4-8 4z"/><path d="M4 8v8l8 4 8-4V8"/></svg>
          <span>选择商品</span>
        </div>
        <div class="alti">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#494B4F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4 4 3 3-2 4 3"/></svg>
          <span>上传照片</span>
        </div>
      </div>
    </div>
  </sc-if>

  <div class="footer">
    <sc-if value="{{ done }}" hint-placeholder-val="{{ true }}">
      <div class="redo" onClick="{{ reset }}">重录</div>
    </sc-if>
    <div class="cta {{ ctaCls }}">{{ ctaText }}</div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'idle', text: '' };
  }

  componentWillUnmount() { if (this.timer) clearTimeout(this.timer); }

  finish(text) {
    this.setState({ phase: 'done', text: text });
  }

  renderVals() {
    const p = this.state.phase;
    const egs = [
      { k: '品牌故事', t: '给我的五金店做一条有情怀的宣传片，开了二十三年了' },
      { k: '带货', t: '新到了一批收纳箱，拍条片子催一下老客' },
      { k: '活动', t: '这周六会员日到店有礼，做条短的发群里' },
    ];
    return {
      idle: p === 'idle',
      rec: p === 'rec',
      done: p === 'done',
      notDone: p !== 'done',
      text: this.state.text,
      micCls: p === 'rec' ? 'rec' : '',
      micLabel: p === 'rec' ? '松开结束' : '按住说话',
      egs: egs.map((e) => ({ k: e.k, t: e.t, use: () => this.finish(e.t) })),
      toggle: () => {
        if (p === 'rec') {
          this.finish('给我的五金店做一条有情怀的宣传片，开了二十三年了');
        } else {
          this.setState({ phase: 'rec' });
          if (this.timer) clearTimeout(this.timer);
          this.timer = setTimeout(() => {
            this.finish('给我的五金店做一条有情怀的宣传片，开了二十三年了');
          }, 2600);
        }
      },
      reset: () => {
        if (this.timer) clearTimeout(this.timer);
        this.setState({ phase: 'idle', text: '' });
      },
      ctaText: p === 'done' ? '确认，下一步' : '请先录入',
      ctaCls: p === 'done' ? '' : 'off',
    };
  }
}
</script>
</body>
</html>
