# 军师 · 监控栈（与 API 同机部署，全部 host 网络）
#
# 为什么全用 network_mode: host：生产是「裸机 Node + 系统 Postgres + Nginx」（见 docs/DEPLOYMENT.md），
# API(:4000)/PG(:5432) 都只监听 127.0.0.1。桥接网络里的容器根本摸不到宿主 loopback，
# 要么给 PG 开 docker 网段监听（扩大攻击面），要么全走 host 网络（本方案）。
# 所有 Web UI 都绑 127.0.0.1，对外只经 Nginx 反代 Grafana 一个口（deploy/nginx.conf.example §grafana）。
#
# 启动：
#   cd deploy/monitoring
#   cp .env.example .env                         # 改密码
#   cp secrets/metrics.token.example secrets/metrics.token   # 填与 API .env 相同的 METRICS_TOKEN
#   docker compose up -d                         # 核心：prometheus + grafana + alertmanager + 3 个 exporter
#   docker compose --profile logs up -d          # 可选：加 Loki + Promtail（journald + nginx 日志）
#
# 版本固定 tag（升级时逐个换并看 release notes，别用 latest）。

services:
  prometheus:
    image: prom/prometheus:v2.53.0        # LTS
    network_mode: host
    restart: unless-stopped
    user: root                            # host 网络 + 本地卷，简化权限；不对外监听
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=127.0.0.1:9090
      - --web.enable-lifecycle            # 改完规则 curl -X POST 127.0.0.1:9090/-/reload 热加载
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - ./secrets/metrics.token:/etc/prometheus/metrics.token:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --web.listen-address=127.0.0.1:9093
      - --cluster.listen-address=         # 单机不组集群
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # 告警回传 API 用同一份 token（alertmanager.yml 的 credentials_file）
      - ./secrets/metrics.token:/etc/alertmanager/metrics.token:ro
      - alertmanager-data:/alertmanager

  grafana:
    image: grafana/grafana:11.4.0
    network_mode: host
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      # 经 Nginx 子路径暴露（https://域名/grafana/）；不走 Nginx 时删掉这两行直接开 3000。
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SUB_PATH:-false}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请在 .env 里设置 GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # 业务看板直查 PG 用的只读账号密码（datasources.yml 里 $__env 引用）
      GRAFANA_PG_PASSWORD: ${GRAFANA_PG_PASSWORD:-}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  node-exporter:
    image: prom/node-exporter:v1.8.2
    network_mode: host
    pid: host
    restart: unless-stopped
    command:
      - --web.listen-address=127.0.0.1:9100
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    network_mode: host
    restart: unless-stopped
    environment:
      # 只读监控账号（建法见 docs/MONITORING.md §3）；host 网络下 127.0.0.1 即宿主 PG。
      DATA_SOURCE_NAME: ${PG_EXPORTER_DSN:?请在 .env 里设置 PG_EXPORTER_DSN}
    command:
      - --web.listen-address=127.0.0.1:9187

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
      - --web.listen-address=127.0.0.1:9115
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro

  # —— 可选：日志（docker compose --profile logs up -d）——
  # Promtail 收 journald（junshi-api 由 systemd 托管，日志都在 journal）+ Nginx access/error。
  # 前提：journald 持久化已开（ls /var/log/journal 非空；否则 mkdir /var/log/journal && systemctl restart systemd-journald）。
  loki:
    image: grafana/loki:3.1.1
    profiles: [logs]
    network_mode: host
    restart: unless-stopped
    user: root
    command: [-config.file=/etc/loki/loki.yml]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.1.1
    profiles: [logs]
    network_mode: host
    restart: unless-stopped
    command: [-config.file=/etc/promtail/promtail.yml]
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /var/log/nginx:/var/log/nginx:ro
      - promtail-data:/tmp/positions

volumes:
  prometheus-data: {}
  alertmanager-data: {}
  grafana-data: {}
  loki-data: {}
  promtail-data: {}
