# 业务告警：钱和合规的事,阈值宁敏勿钝。
groups:
  - name: junshi-business
    rules:
      # 用户付了钱、权益没发放。sweep 每 5 分钟自愈一轮,10 分钟还在 >0 就是真卡住了。
      - alert: JunshiPaidNotApplied
        expr: junshi_pay_stuck_paid_unapplied > 0
        for: 10m
        labels: { severity: critical, category: payment }
        annotations:
          summary: "有 {{ $value }} 笔订单已支付未发放权益超 10 分钟——去运营后台「订单」页手动补账"
          current: "{{ $value | printf \"%.0f\" }} 笔已支付未发放"

      - alert: JunshiPaySweepFailing
        expr: junshi_pay_sweep_last{result="failed"} > 0
        for: 15m
        labels: { severity: warning, category: payment }
        annotations:
          summary: "支付对账 sweep 持续报终态失败单——查微信侧交易状态"
          current: "最近一轮 {{ $value | printf \"%.0f\" }} 笔失败"

      - alert: JunshiPaySweepStopped
        expr: >
          junshi_process_uptime_seconds > 20 * 60
          and on() increase(junshi_pay_sweep_runs_total[15m]) == 0
        for: 5m
        labels: { severity: critical, category: payment }
        annotations:
          summary: "API 已稳定运行，但支付对账任务 15 分钟没有执行"
          current: "15 分钟 sweep 增量为 0"

      - alert: JunshiRefundSpike
        expr: increase(junshi_pay_refunds_total[6h]) > scalar(junshi_alert_config{key="refund_spike_6h"})
        labels: { severity: warning, category: payment }
        annotations:
          summary: "6 小时内退款笔数超过阈值——产品或计费可能出了让用户要钱的问题"
          current: "6 小时 {{ $value | printf \"%.0f\" }} 笔退款"

      - alert: JunshiModerationBlockSpike
        expr: sum by (ref) (increase(junshi_moderation_checks_total{verdict="block"}[1h])) > scalar(junshi_alert_config{key="moderation_block_1h"})
        labels: { severity: warning, category: security }
        annotations:
          summary: "1 小时内内容审核拦截超过阈值（ref={{ $labels.ref }}）——可能被灌注攻击或审核误伤"
          current: "ref={{ $labels.ref }} · 1 小时 {{ $value | printf \"%.0f\" }} 次拦截"

      # 注册通道静默:三天零注册对一个在推广的产品是异常信号（阈值按增长阶段自行调整或删除）。
      - alert: JunshiNoRegistrations72h
        expr: sum(increase(junshi_user_registrations_total[3d])) == 0
        for: 1h
        labels: { severity: warning, category: growth }
        annotations:
          summary: "72 小时无新注册——如非预期,查微信登录链路与短信通道"
          current: "全部渠道 72 小时注册增量为 0"

      - alert: JunshiCreativeFailureRateHigh
        expr: >
          (
            sum(increase(junshi_creative_jobs_total{event="failed"}[1h]))
              / clamp_min(sum(increase(junshi_creative_jobs_total{event="created"}[1h])), 1)
            > 0.2
          )
          and on() sum(increase(junshi_creative_jobs_total{event="created"}[1h])) >= 5
        for: 5m
        labels: { severity: critical, category: business }
        annotations:
          summary: "创作任务 1 小时失败率超过 20%，且样本不少于 5 个"
          current: "1 小时失败率 {{ $value | humanizePercentage }}"

      - alert: JunshiCreativeTemplateFallback
        expr: sum(increase(junshi_creative_engine_total{engine="template_fallback"}[1h])) > 3
        labels: { severity: warning, category: business }
        annotations:
          summary: "AI 排版引擎频繁回退到模板，任务虽成功但质量正在退化"
          current: "1 小时 {{ $value | printf \"%.0f\" }} 次模板回退"
