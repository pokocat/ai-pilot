# 业务告警：钱和合规的事,阈值宁敏勿钝。
groups:
  - name: junshi-business
    rules:
      # 用户付了钱、权益没发放。sweep 每 5 分钟自愈一轮,10 分钟还在 >0 就是真卡住了。
      - alert: JunshiPaidNotApplied
        expr: junshi_pay_stuck_paid_unapplied > 0
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "有 {{ $value }} 笔订单已支付未发放权益超 10 分钟——去运营后台「订单」页手动补账"

      - alert: JunshiPaySweepFailing
        expr: junshi_pay_sweep_last{result="failed"} > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "支付对账 sweep 持续报终态失败单——查微信侧交易状态"

      - alert: JunshiRefundSpike
        expr: increase(junshi_pay_refunds_total[6h]) > scalar(junshi_alert_config{key="refund_spike_6h"})
        labels: { severity: warning }
        annotations:
          summary: "6 小时内退款笔数超过阈值——产品或计费可能出了让用户要钱的问题"

      - alert: JunshiModerationBlockSpike
        expr: sum by (ref) (increase(junshi_moderation_checks_total{verdict="block"}[1h])) > scalar(junshi_alert_config{key="moderation_block_1h"})
        labels: { severity: warning }
        annotations:
          summary: "1 小时内内容审核拦截超过阈值（ref={{ $labels.ref }}）——可能被灌注攻击或审核误伤"

      # 注册通道静默:三天零注册对一个在推广的产品是异常信号（阈值按增长阶段自行调整或删除）。
      - alert: JunshiNoRegistrations72h
        expr: sum(increase(junshi_user_registrations_total[3d])) == 0
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "72 小时无新注册——如非预期,查微信登录链路与短信通道"
