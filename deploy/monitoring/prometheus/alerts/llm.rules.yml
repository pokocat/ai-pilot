# LLM 网关告警。429 率 / 队列等待 / Token 成本的**默认阈值** = 压测方案 §7 告警线原文；
# 运行值全部从 junshi_alert_config 取（运营后台「功能开关」页「告警 ·」系列可调，≤75s 生效）。
# 注意：junshi_alert_config 来自 API 的 /api/metrics——API 挂掉时这些规则静默不评估，
# 由 api.rules.yml 的 JunshiApiDown（不依赖动态阈值）兜底。
groups:
  - name: junshi-llm
    rules:
      - alert: JunshiLlm429RateHigh
        expr: >
          (
            sum(rate(junshi_llm_upstream_429_total[10m]))
              / clamp_min(sum(rate(junshi_llm_granted_total[10m])), 1e-9)
            >= scalar(junshi_alert_config{key="llm_429_warn_permille"}) / 1000
          )
          and on() sum(increase(junshi_llm_granted_total[10m])) >= 20
        for: 5m
        labels: { severity: warning, category: llm_gateway, signal: llm_429_rate }
        annotations:
          summary: "模型服务限流率升高，部分请求正在被上游拒绝。"
          current: "10 分钟限流率 {{ $value | humanizePercentage }}"
      - alert: JunshiLlm429RateCritical
        expr: >
          (
            sum(rate(junshi_llm_upstream_429_total[10m]))
              / clamp_min(sum(rate(junshi_llm_granted_total[10m])), 1e-9)
            >= scalar(junshi_alert_config{key="llm_429_crit_permille"}) / 1000
          )
          and on() sum(increase(junshi_llm_granted_total[10m])) >= 20
        for: 5m
        labels: { severity: critical, category: llm_gateway, signal: llm_429_rate }
        annotations:
          summary: "模型服务限流严重，生成等待和失败风险快速上升。"
          current: "10 分钟限流率 {{ $value | humanizePercentage }}"

      # 端点探活（services/aiProbe）：定时对每个上游端点跑连通性 / thinking 写法 / 模型范围三项。
      # 与「模型调用失败率」是两码事——探活先红意味着我们**在用户撞上之前**就发现了这个端点坏了。
      # 只在连续失败时告警：单次失败可能只是一次抖动，探活本身也走网络。
      - alert: JunshiAiEndpointProbeFailing
        expr: >
          sum by (kind) (increase(junshi_ai_endpoint_probe_total{status="fail"}[30m])) >= 3
          and on(kind) sum by (kind) (increase(junshi_ai_endpoint_probe_total[30m])) >= 3
        for: 10m
        labels: { severity: warning, category: llm_gateway }
        annotations:
          summary: "上游端点检测连续失败，该能力当前不可用。"
          current: "30 分钟内 {{ $labels.kind }} 检测失败 {{ $value | printf \"%.0f\" }} 次"

      - alert: JunshiLlmErrorRateHigh
        expr: >
          (
            sum(increase(junshi_llm_calls_total{status="error"}[15m]))
              / clamp_min(sum(increase(junshi_llm_calls_total[15m])), 1)
            > 0.1
          )
          and on() sum(increase(junshi_llm_calls_total[15m])) >= 10
        for: 5m
        labels: { severity: critical, category: llm_gateway }
        annotations:
          summary: "模型调用失败率超过 10%，对话或方案生成可能失败。"
          current: "15 分钟错误率 {{ $value | humanizePercentage }}"

      # 按错误类型细分（区别于上面的整体错误率）：不同类型处置动作完全不同，混在一起
      # 只知道「错误率高了」，不知道该查密钥、上下文长度还是网络。bucket 语义见
      # server/src/llm/errorClassify.ts。
      - alert: JunshiLlmAuthErrors
        expr: sum by (provider) (increase(junshi_llm_errors_total{bucket="auth"}[15m])) > 0
        for: 5m
        labels: { severity: critical, category: llm_gateway }
        annotations:
          summary: "模型服务鉴权失败，对应模型来源在问题解决前会持续报错。"
          current: "来源 {{ $labels.provider }} · 15 分钟鉴权失败 {{ $value | printf \"%.0f\" }} 次"

      # 覆盖除鉴权/限流/我方主动决策（排队拒绝、审核拦截、续写失败）外的其余错误类型——
      # 那几类已有各自专属告警，混进来会重复响铃。
      - alert: JunshiLlmErrorByCategory
        expr: >
          sum by (provider, model, bucket) (
            increase(junshi_llm_errors_total{bucket!~"busy|moderation|output_truncated|rate_limit|auth"}[15m])
          ) > 3
        for: 10m
        labels: { severity: warning, category: llm_gateway }
        annotations:
          summary: "模型调用出现特定类型的失败，处置方式因类型而异，不是简单重试能解决的。"
          current: "来源 {{ $labels.provider }} · 模型 {{ $labels.model }} · 类型 {{ $labels.bucket }} · 15 分钟 {{ $value | printf \"%.0f\" }} 次"

      - alert: JunshiLlmCallP95Slow
        expr: >
          histogram_quantile(0.95, sum by (le) (
            rate(junshi_llm_call_duration_seconds_bucket[30m])
          )) > scalar(junshi_alert_config{key="llm_call_p95_s"})
        for: 10m
        labels: { severity: warning, category: llm_gateway }
        annotations:
          summary: "模型调用耗时持续超过预警线，用户等待时间正在变长。"
          current: "30 分钟调用 P95 {{ $value | printf \"%.1f\" }} 秒"

      # 口径注：告警仍用等待峰值（gauge）近似 §7 的「等待 P95」，阈值不变——峰值≥P95，
      # 触发只会更早不会漏，沿用是为了不改动这条已验证过的告警。2026-08-07 起
      # junshi_llm_wait_seconds 直方图已能算真实分位数，看板用它画真实曲线；
      # 后续如要把这条告警也换成真实 P95，两条一起改、别只改一条留下口径分叉。
      - alert: JunshiLlmQueueWaitLong
        expr: max(junshi_llm_wait_max_seconds) >= scalar(junshi_alert_config{key="llm_wait_warn_s"})
        for: 5m
        labels: { severity: warning, category: llm_gateway, signal: llm_queue_wait }
        annotations:
          summary: "模型请求排队时间持续超过预警线。"
          current: "等待峰值 {{ $value | printf \"%.1f\" }} 秒"
      - alert: JunshiLlmQueueWaitCritical
        expr: max(junshi_llm_wait_max_seconds) >= scalar(junshi_alert_config{key="llm_wait_crit_s"})
        for: 5m
        labels: { severity: critical, category: llm_gateway, signal: llm_queue_wait }
        annotations:
          summary: "模型请求排队严重，部分请求已接近超时。"
          current: "等待峰值 {{ $value | printf \"%.1f\" }} 秒"

      - alert: JunshiLlmQueueRejected
        expr: >
          sum by (lane) (increase(junshi_llm_rejected_total[15m]))
            + sum by (lane) (increase(junshi_llm_timed_out_total[15m])) > 0
        labels: { severity: critical, category: llm_gateway }
        annotations:
          summary: "模型请求因队列满载或等待超时被拒绝。"
          current: "调用通道 {{ $labels.lane }} · 15 分钟 {{ $value | printf \"%.0f\" }} 次"

      - alert: JunshiLlmCoolingLong
        expr: junshi_llm_cooling == 1
        for: 5m
        labels: { severity: warning, category: llm_gateway }
        annotations:
          summary: "模型调用通道因连续限流暂停接单超过 5 分钟。"
          current: "调用通道 {{ $labels.lane }} · 已暂停接单 5 分钟"

      # —— Token 日成本（§7：日预算 70% 预警 / 90% 收缩 / 100% 硬停止）——
      # 日预算=后台「告警 · Token 日预算」数值项（默认 200 元/天），70%/90% 由表达式派生。
      - alert: JunshiTokenCostBudget70
        expr: sum(increase(junshi_llm_cost_cny_total[1d])) > 0.7 * scalar(junshi_alert_config{key="token_daily_budget_cny"})
        labels: { severity: warning, category: cost, signal: token_daily_cost }
        annotations:
          summary: "过去 24 小时模型成本已达到日预算的 70%，进入关注区。"
          current: "滚动 24 小时 {{ $value | printf \"%.2f\" }} 元"
      - alert: JunshiTokenCostBudget90
        expr: sum(increase(junshi_llm_cost_cny_total[1d])) > 0.9 * scalar(junshi_alert_config{key="token_daily_budget_cny"})
        labels: { severity: critical, category: cost, signal: token_daily_cost }
        annotations:
          summary: "过去 24 小时模型成本已达到日预算的 90%，接近成本红线。"
          current: "滚动 24 小时 {{ $value | printf \"%.2f\" }} 元"

      - alert: JunshiTokenCostBudget100
        expr: sum(increase(junshi_llm_cost_cny_total[1d])) >= scalar(junshi_alert_config{key="token_daily_budget_cny"})
        labels: { severity: critical, category: cost, signal: token_daily_cost }
        annotations:
          summary: "过去 24 小时模型成本已用尽日预算，必须执行成本控制。"
          current: "滚动 24 小时 {{ $value | printf \"%.2f\" }} 元"

      - alert: JunshiUsageUnreported
        expr: increase(junshi_usage_unreported_total[1h]) > 0
        labels: { severity: warning, category: cost }
        annotations:
          summary: "模型服务未返回完整用量数据，成本报表可能低估实际消耗。"
          current: "来源 {{ $labels.provider }} · 模型 {{ $labels.model }} · 1 小时缺失 {{ $value | printf \"%.0f\" }} 次"

      - alert: JunshiGenDegraded
        expr: increase(junshi_gen_degraded_total[15m]) > 0
        labels: { severity: warning, category: business }
        annotations:
          summary: "AI 产出已触发保底内容，用户获得的结果质量可能低于正常水平。"
          current: "降级路径 {{ $labels.path }} · 15 分钟 {{ $value | printf \"%.0f\" }} 次"

  # ──────────────────────────────────────────────────────────────────────
  # 对话交互质量（2026-08-04 截断/超时复盘后补）
  #
  # 这一组回答「用户这一轮体验到了什么」，与上面的调用量/成本互补：全都 200 成功、
  # 但首字等 40 秒、或逐字流其实没在流、或半篇回答被换成错误气泡——上面那些指标一个都看不出来。
  # 阈值同样走 junshi_alert_config（后台「功能开关」页「告警 ·」系列可调，≤75s 生效）。
  # ──────────────────────────────────────────────────────────────────────
  - name: junshi-chat
    rules:
      # 撞输出上限后**自动续写仍没写完**：用户真的看到了「内容较长，先写到这里」。
      # 注意必须按 resolved="given_up" 过滤——resolved="continued" 是被救回来的，那是好事不是事故。
      - alert: JunshiChatTruncatedGivenUp
        expr: >
          sum(increase(junshi_llm_output_truncated_total{resolved="given_up"}[1h]))
          > scalar(junshi_alert_config{key="chat_truncated_1h"})
        labels: { severity: warning, category: chat_experience }
        annotations:
          summary: "自动续写后仍有回答未完整生成，用户可能拿到不完整内容。"
          current: "1 小时 {{ $value | printf \"%.0f\" }} 次"

      # 续写被频繁触发：用户无感，但每次都在多烧一轮 token，且说明预算/长度约束不匹配当前用法。
      - alert: JunshiChatContinuationBusy
        expr: >
          sum(increase(junshi_llm_output_truncated_total{resolved="continued"}[1h]))
          > scalar(junshi_alert_config{key="chat_continued_1h"})
        labels: { severity: info, category: chat_experience }
        annotations:
          summary: "自动续写次数明显升高，响应时长和模型成本同步增加。"
          current: "1 小时 {{ $value | printf \"%.0f\" }} 次"

      # 空闲看门狗触发＝上游发完响应头就不发了。这不是「慢」，是「装死」，>0 就该看。
      # first_event 多＝上游排队/思考期就断供；mid_stream 多＝流中途被掐。
      - alert: JunshiChatStreamStall
        expr: increase(junshi_chat_stream_stall_total[15m]) > 0
        labels: { severity: warning, category: chat_experience }
        annotations:
          summary: "模型输出中途停止，系统已终止异常连接并释放资源。"
          current: "来源 {{ $labels.provider }} · 阶段 {{ $labels.phase }} · 15 分钟 {{ $value | printf \"%.0f\" }} 次"

      # 原生流建流失败回落非流式：非流式吃总时长超时，正是 2026-08-04 那 6 次精确 60.0s 超时的前置。
      - alert: JunshiChatStreamFallback
        expr: increase(junshi_chat_nonstream_total{reason="stream_failed"}[15m]) > 0
        labels: { severity: warning, category: chat_experience }
        annotations:
          summary: "逐字输出不可用，部分对话已切换为完整生成后一次性返回。"
          current: "15 分钟 {{ $value | printf \"%.0f\" }} 次"

      # 首字延迟 P95：用户唯一直接体感到的等待。histogram_quantile 需要 _bucket 序列。
      - alert: JunshiChatFirstTokenSlow
        expr: >
          histogram_quantile(0.95, sum(rate(junshi_chat_first_token_seconds_bucket[30m])) by (le))
          > scalar(junshi_alert_config{key="chat_first_token_p95_s"})
        for: 10m
        labels: { severity: warning, category: chat_experience }
        annotations:
          summary: "用户发送消息后，首段内容出现时间持续超过预警线。"
          current: "首字 P95 {{ $value | printf \"%.1f\" }} 秒"

      # 安全网健康度：只看 had_text=yes 的 stall；首事件卡死、只有 thinking/ping 的中途卡死
      # 本来就没有正文可保全，不能据此报 critical。两侧按 provider 对齐，要求同 provider 的
      # stream_error 保全为 0 才报警。
      - alert: JunshiChatPartialKeptBroken
        expr: >
          sum by(provider) (increase(junshi_chat_stream_stall_total{had_text="yes"}[1h])) > 0
          and on(provider)
          sum by(provider) (increase(junshi_chat_partial_kept_total{cause="stream_error"}[1h])) == 0
        for: 5m
        labels: { severity: critical, category: chat_experience }
        annotations:
          summary: "模型输出中断后，已经展示的回答可能未被正确保留。"
          current: "来源 {{ $labels.provider }} · 已出现正文中断 · 保全记录 0 次"

      # 持久生成任务的结果面：有一定样本后失败率 >10% 才报，
      # 避免低流量时单个用户取消/网络波动放大成 100% 假警。
      - alert: JunshiChatGenerationFailureRateHigh
        expr: >
          (
            sum(increase(junshi_chat_generation_total{result="failed"}[15m]))
              / clamp_min(sum(increase(junshi_chat_generation_total[15m])), 1)
            > 0.1
          )
          and on() sum(increase(junshi_chat_generation_total[15m])) >= 5
        for: 5m
        labels: { severity: warning, category: chat_experience }
        annotations:
          summary: "15 分钟内对话生成失败率超过 10%，用户可能需要重试。"
          current: "15 分钟失败率 {{ $value | humanizePercentage }}"

      - alert: JunshiChatGenerationRecovered
        expr: increase(junshi_chat_generation_recovered_total[15m]) > 0
        labels: { severity: warning, category: chat_experience }
        annotations:
          summary: "对话生成任务发生自动接管，通常表示服务重启或任务长时间未完成。"
          current: "15 分钟自动接管 {{ $value | printf \"%.0f\" }} 次"

      # 长会话不能再靠 24 小时断链“重置”。摘要一旦撞顶，用户后续新增事实就不会进入上下文，
      # 表面是 200 成功，实际体感是军师突然失忆，因此 capped 必须按用户体验事故处理。
      - alert: JunshiSessionDigestCapped
        expr: sum(increase(junshi_session_digest_updates_total{status="capped"}[15m])) > 0
        labels: { severity: critical, category: chat_experience }
        annotations:
          summary: "有长会话摘要已撞上限，军师可能无法记住后续新增事实。"
          current: "15 分钟撞顶 {{ $value | printf \"%.0f\" }} 次"

      - alert: JunshiSessionDigestCompactionFailed
        expr: sum(increase(junshi_session_digest_compactions_total{outcome="failed"}[15m])) > 0
        labels: { severity: warning, category: chat_experience }
        annotations:
          summary: "长会话滚动压缩失败，摘要仍保留原游标但连续性开始承压。"
          current: "15 分钟失败 {{ $value | printf \"%.0f\" }} 次"

      - alert: JunshiSessionDigestUnhealthy
        expr: sum(increase(junshi_session_digest_updates_total{status=~"failed|cooldown"}[15m])) > 2
        labels: { severity: warning, category: chat_experience }
        annotations:
          summary: "会话摘要连续未能追平，近期回答可能缺少较早的客户事实。"
          current: "15 分钟异常 {{ $value | printf \"%.0f\" }} 次"
