# API 服务告警。线上告警只统计用户交互接口，并要求最小样本量；压测容量线继续留在压测方案，
# 不直接拿来触发生产故障通知。剔除生成/流式、上传、监控、回调、探活等天然长耗时或控制面路径，
# 尤其不能把 /api/alerts/webhook 自身算进 API P95，否则会形成“通知慢 → 再通知”的自激循环。
groups:
  - name: junshi-api
    rules:
      - alert: JunshiApiDown
        expr: up{job="junshi-api"} == 0
        for: 1m
        labels: { severity: critical, category: availability }
        annotations:
          summary: "API 监控数据连续 1 分钟无法采集，服务可能已经离线。"
          current: "目标 {{ $labels.instance }} · 已中断 1 分钟"

      - alert: JunshiProbeFailed
        expr: probe_success == 0
        for: 2m
        labels: { severity: critical, category: availability }
        annotations:
          summary: "服务端到端探活失败；本机失败通常是服务问题，仅公网失败通常是网关、域名或证书问题。"
          current: "目标 {{ $labels.instance }} · 探活失败"

      - alert: JunshiTlsCertExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 14 * 24 * 3600
        for: 1h
        labels: { severity: warning, category: availability }
        annotations:
          summary: "HTTPS 证书将在 14 天内到期，届时小程序和后台将无法正常访问。"
          current: "目标 {{ $labels.instance }} · 剩余 {{ $value | humanizeDuration }}"

      - alert: JunshiApiP95High
        expr: >
          (
            histogram_quantile(0.95, sum by (le) (
              rate(junshi_http_request_duration_seconds_bucket{route!~".*(generate|stream|upload|webhook|callback|metrics|health).*"}[15m])
            )) > scalar(junshi_alert_config{key="api_p95_warn_ms"}) / 1000
          )
          and on()
          sum(increase(junshi_http_request_duration_seconds_count{route!~".*(generate|stream|upload|webhook|callback|metrics|health).*"}[15m]))
            >= scalar(junshi_alert_config{key="api_min_requests_15m"})
        for: 10m
        labels: { severity: warning, category: api, signal: api_latency }
        annotations:
          summary: "用户交互接口整体变慢，且已排除监控回调、文件上传等天然长耗时请求。"
          current: '15 分钟用户接口 P95 {{ $value | printf "%.2f" }} 秒'
          threshold: 'P95 > {{ with query "junshi_alert_config{key=\"api_p95_warn_ms\"}" }}{{ . | first | value | humanize }}{{ end }} 毫秒 · 样本达到后台配置线 · 持续 10 分钟'
      - alert: JunshiApiP95Critical
        expr: >
          (
            histogram_quantile(0.95, sum by (le) (
              rate(junshi_http_request_duration_seconds_bucket{route!~".*(generate|stream|upload|webhook|callback|metrics|health).*"}[15m])
            )) > scalar(junshi_alert_config{key="api_p95_crit_ms"}) / 1000
          )
          and on()
          sum(increase(junshi_http_request_duration_seconds_count{route!~".*(generate|stream|upload|webhook|callback|metrics|health).*"}[15m]))
            >= scalar(junshi_alert_config{key="api_min_requests_15m"})
        for: 5m
        labels: { severity: critical, category: api, signal: api_latency }
        annotations:
          summary: "用户交互接口延迟严重，部分用户操作可能已经出现明显卡顿或超时。"
          current: '15 分钟用户接口 P95 {{ $value | printf "%.2f" }} 秒'
          threshold: 'P95 > {{ with query "junshi_alert_config{key=\"api_p95_crit_ms\"}" }}{{ . | first | value | humanize }}{{ end }} 毫秒 · 样本达到后台配置线 · 持续 5 分钟'

      - alert: JunshiApi5xxRateHigh
        expr: >
          (
            sum(increase(junshi_http_route_responses_total{class="5xx", route!~".*(generate|stream|upload|webhook|callback|metrics|health).*"}[15m]))
              / clamp_min(sum(increase(junshi_http_route_responses_total{route!~".*(generate|stream|upload|webhook|callback|metrics|health).*"}[15m])), 1)
            > scalar(junshi_alert_config{key="api_5xx_crit_permille"}) / 1000
          )
          and on()
          sum(increase(junshi_http_route_responses_total{route!~".*(generate|stream|upload|webhook|callback|metrics|health).*"}[15m]))
            >= scalar(junshi_alert_config{key="api_min_requests_15m"})
        for: 5m
        labels: { severity: critical, category: api }
        annotations:
          summary: "用户交互接口错误率持续超过严重线，部分用户请求已经失败。"
          current: '15 分钟用户接口错误率 {{ $value | humanizePercentage }}'
          threshold: '错误率 > {{ with query "junshi_alert_config{key=\"api_5xx_crit_permille\"}" }}{{ . | first | value | humanize }}{{ end }}‰ · 样本达到后台配置线 · 持续 5 分钟'

      - alert: JunshiApiRateLimitedSpike
        expr: increase(junshi_http_rate_limited_total[5m]) > scalar(junshi_alert_config{key="http_429_5m"})
        labels: { severity: warning, category: api }
        annotations:
          summary: "API 限流次数超过配置线，正常用户可能开始受到影响。"
          current: "5 分钟限流 {{ $value | printf \"%.0f\" }} 次"

      - alert: JunshiOverloadRejecting
        expr: increase(junshi_http_overload_rejected_total[5m]) > 0
        labels: { severity: warning, category: api }
        annotations:
          summary: "服务容量已触顶，系统开始主动拒绝部分请求以保护核心链路。"
          current: "5 分钟主动拒绝 {{ $value | printf \"%.0f\" }} 次"

      - alert: JunshiEventLoopSlow
        expr: junshi_nodejs_event_loop_delay_seconds{quantile="0.95"} > 0.2
        for: 10m
        labels: { severity: warning, category: api }
        annotations:
          summary: "API 主线程响应持续变慢，可能影响全部接口。"
          current: "主线程 P95 延迟 {{ $value | printf \"%.3f\" }} 秒"

      - alert: JunshiRssGrowing
        expr: junshi_process_resident_memory_bytes > scalar(junshi_alert_config{key="rss_warn_mb"}) * 1024 * 1024
        for: 30m
        labels: { severity: warning, category: api }
        annotations:
          summary: "API 进程内存持续超过预警线，继续增长可能导致服务重启。"
          current: "进程常驻内存 {{ $value | printf \"%.0f\" }} 字节"
