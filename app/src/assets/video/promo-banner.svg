<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 360" width="750" height="360">
  <!-- 「快出片」落地页宣传横幅。
       风格对齐 src/assets/craft/*.jpg 的细线手绘：米白底 + #191A1C 线稿 + #F06435 点缀。
       比例 750×360（2.08:1）＝ 端上 350×168 的横幅位，避免 aspectFill 裁掉构图。
       纯矢量、无外链字体、无位图、无滤镜 —— PNG 由 scripts/build-promo-banner.mjs 渲染。 -->
  <defs>
    <radialGradient id="glow" cx="26%" cy="34%" r="42%">
      <stop offset="0%" stop-color="#F06435" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F06435" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F06435" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#F06435" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="750" height="360" fill="#F7F6F2"/>
  <rect width="750" height="360" fill="url(#glow)"/>

  <g stroke="#191A1C" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- ── 左：沿街小店 ───────────────────────────────────────── -->
    <!-- 店面外框 -->
    <path d="M96 300 V126 h188 V300"/>
    <!-- 雨棚 -->
    <path d="M84 126 L108 100 h164 l24 26 Z"/>
    <path d="M84 126 h212" stroke-width="2.2"/>

    <!-- 招牌（暖橙点亮） -->
    <rect x="126" y="60" width="128" height="34" rx="6" fill="#F06435" fill-opacity="0.14"/>
    <rect x="126" y="60" width="128" height="34" rx="6"/>
    <path d="M144 77 h34 M190 77 h46" stroke="#F06435" stroke-width="3.4"/>
    <path d="M158 94 v6 M222 94 v6"/>

    <!-- 卷闸门半开：上半是收起的帘，下半露出门内 -->
    <path d="M112 142 h156 v42 h-156 Z"/>
    <path d="M112 150 h156 M112 158 h156 M112 166 h156 M112 174 h156" stroke-width="1.4"/>
    <!-- 门内：柜台与一盏灯 -->
    <path d="M112 184 v116 M268 184 v116"/>
    <path d="M132 300 v-46 h56 v46" />
    <path d="M132 262 h56" stroke-width="1.4"/>

    <!-- 吊灯（暖橙点亮）：吊绳 + 梯形灯罩 + 光锥 -->
    <circle cx="232" cy="226" r="30" fill="url(#lampGlow)"/>
    <path d="M232 186 v16"/>
    <path d="M220 216 l6 -14 h12 l6 14 Z" fill="#F06435" fill-opacity="0.26"/>
    <path d="M218 216 h28"/>
    <path d="M224 224 l-6 14 M232 224 v16 M240 224 l6 14" stroke="#F06435" stroke-width="1.6" stroke-opacity="0.7"/>

    <!-- 台阶 -->
    <path d="M78 300 h224"/>
    <path d="M88 312 h204 M100 324 h180" stroke-width="1.6"/>

    <!-- ── 右：竖屏手机 + 说话的人 ────────────────────────────── -->
    <!-- 机身 9:16 -->
    <rect x="470" y="70" width="150" height="248" rx="20" fill="#FFFFFF"/>
    <rect x="470" y="70" width="150" height="248" rx="20"/>
    <path d="M524 82 h42" stroke-width="3"/>

    <!-- 屏内人像：头 + 肩 -->
    <circle cx="545" cy="160" r="30"/>
    <path d="M497 262 c0 -34 22 -56 48 -56 s48 22 48 56"/>
    <!-- 简笔五官，克制 -->
    <path d="M534 155 h6 M551 155 h6" stroke-width="2.4"/>
    <path d="M538 173 q7 6 14 0" stroke="#F06435" stroke-width="2.4"/>

    <!-- 屏底进度条：暗示"正在出片" -->
    <path d="M494 288 h102" stroke-width="4" stroke-opacity="0.16"/>
    <path d="M494 288 h58" stroke="#F06435" stroke-width="4"/>

    <!-- 声波弧线 -->
    <path d="M646 132 q22 48 0 96" stroke="#F06435" stroke-width="2.4"/>
    <path d="M670 112 q32 68 0 136" stroke="#F06435" stroke-width="2" stroke-opacity="0.62"/>
    <path d="M694 96 q42 84 0 168" stroke="#F06435" stroke-width="1.8" stroke-opacity="0.32"/>

    <!-- ── 中间：从店到片的连接 ──────────────────────────────── -->
    <path d="M330 214 h96" stroke-width="1.6" stroke-dasharray="6 8" stroke-opacity="0.5"/>
    <path d="M414 206 l14 8 l-14 8" stroke-width="1.6" stroke-opacity="0.5"/>

    <!-- ── 底：街道地面 ─────────────────────────────────────── -->
    <path d="M40 340 h150 M226 340 h96 M356 340 h58 M446 340 h132 M610 340 h100" stroke-width="1.6" stroke-opacity="0.34"/>
  </g>
</svg>
